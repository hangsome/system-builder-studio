<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教师登录</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f4f7fb; font-family: "Microsoft YaHei", system-ui, sans-serif; color: #172033; }
    main { width: min(92vw, 420px); border: 1px solid #d7e0eb; border-radius: 18px; background: white; padding: 26px; box-shadow: 0 18px 46px rgba(23,32,51,.08); }
    h1 { margin: 0 0 10px; font-size: 26px; }
    p { color: #5b697b; line-height: 1.7; }
    label { display: grid; gap: 8px; font-weight: 700; }
    input { min-height: 42px; border: 1px solid #b8c6d5; border-radius: 10px; padding: 8px 10px; }
    button { margin-top: 16px; width: 100%; min-height: 42px; border: 0; border-radius: 10px; background: #246b86; color: white; font-weight: 700; cursor: pointer; }
    .error { color: #9a392f; }
  </style>
</head>


  <main>
    <h1>课堂活动教师后台</h1>
    <p>请输入教师查看密码。学生页面不提供此入口。</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <label>教师密码
        <input name="password" type="password" autofocus>
      </label>
      <button type="submit">进入后台</button>
    </form>
  </main>
</body>
</html>
