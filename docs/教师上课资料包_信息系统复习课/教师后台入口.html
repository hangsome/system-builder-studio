<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=http://159.75.213.93/activity-submit/teacher">
  <title>正在进入教师后台</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #5f6c7b;
      --line: #d8e1ea;
      --soft: #f4efe6;
      --accent: #8a5b2f;
      --accent-strong: #65401f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 80% 18%, rgba(138, 91, 47, .16), transparent 32%),
        linear-gradient(135deg, #fffaf2 0%, #f1f4f7 100%);
      color: var(--ink);
    }
    main {
      width: min(680px, calc(100vw - 40px));
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 24px 70px rgba(15, 23, 42, .10);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--accent-strong);
      font-size: 14px;
      font-weight: 700;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px rgba(138, 91, 47, .12); }
    h1 { margin: 18px 0 10px; font-size: clamp(30px, 5vw, 46px); line-height: 1.08; }
    p { margin: 0; color: var(--muted); line-height: 1.8; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 9px 15px;
      border-radius: 12px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
    a.secondary { background: white; color: var(--accent-strong); border-color: #d7c4ae; }
  </style>
  <script>
    window.location.replace('http://159.75.213.93/activity-submit/teacher');
  </script>
</head>


<main>
  <span class="eyebrow"><span class="dot"></span>教师入口</span>
  <h1>正在进入教师后台</h1>
  <p>本页会自动跳转到服务器教师后台，用于查看学生活动提交。若浏览器没有自动跳转，请点击下方按钮。</p>
  <div class="actions">
    <a href="http://159.75.213.93/activity-submit/teacher">立即进入教师后台</a>
    <a class="secondary" href="课堂链接导航.html">返回学生入口</a>
  </div>
