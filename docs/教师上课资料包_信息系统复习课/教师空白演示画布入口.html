<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教师空白演示画布入口</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --line: #d9e2ec;
      --accent: #246b86;
      --accent-dark: #164d61;
      --bg: #f5f8fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 28px;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 18%, rgba(36, 107, 134, .14), transparent 34%),
        linear-gradient(135deg, #ffffff, var(--bg));
    }

    main {
      width: min(760px, 100%);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, .92);
      padding: 34px;
      box-shadow: 0 18px 48px rgba(23, 32, 51, .12);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    p {
      margin: 0;
      max-width: 62ch;
      color: var(--muted);
      line-height: 1.8;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 26px;
    }

    a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0 18px;
      text-decoration: none;
      font-weight: 800;
      transition: transform .18s ease, background .18s ease;
    }

    a:active { transform: translateY(1px); }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .primary:hover { background: var(--accent-dark); }

    .secondary {
      border: 1px solid var(--line);
      color: var(--ink);
      background: #fff;
    }
  </style>
</head>
<body>
  <main>
    <h1>教师空白演示画布</h1>
    <p>
      这个入口供教师课堂投屏演示使用。点击后进入系统的空白画布，从零开始拖入智能终端、传感器、执行器、IoT、路由器、服务器和数据库，便于根据学生回答逐步搭建硬件框架。
    </p>
    <div class="actions">
      <a class="primary" href="http://159.75.213.93/system-builder/teacher-demo-blank" target="_blank" rel="noopener">打开教师空白演示画布</a>
      <a class="secondary" href="http://159.75.213.93/system-builder/openclass" target="_blank" rel="noopener">打开学生半成品画布</a>
      <a class="secondary" href="http://159.75.213.93/activity-submit/activity" target="_blank" rel="noopener">打开课堂活动页</a>
    </div>
  </main>
</body>
</html>
