<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=http://159.75.213.93/activity-submit/activity">
  <title>正在进入信息系统复习课</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #5f6c7b;
      --line: #d8e1ea;
      --soft: #eef6fb;
      --accent: #2f6f8f;
      --accent-strong: #1f536b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(47, 111, 143, .14), transparent 30%),
        linear-gradient(135deg, #f7fbfd 0%, #eef3f7 100%);
      color: var(--ink);
    }
    main {
      width: min(680px, calc(100vw - 40px));
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, .88);
      box-shadow: 0 24px 70px rgba(15, 23, 42, .10);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--accent-strong);
      font-size: 14px;
      font-weight: 700;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px rgba(47, 111, 143, .12); }
    h1 { margin: 18px 0 10px; font-size: clamp(30px, 5vw, 46px); line-height: 1.08; }
    p { margin: 0; color: var(--muted); line-height: 1.8; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 9px 15px;
      border-radius: 12px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
    a.secondary { background: white; color: var(--accent-strong); border-color: #b8ccd8; }
    code { padding: 2px 6px; border-radius: 6px; background: #edf2f7; }
  </style>
  <script>
    window.location.replace('http://159.75.213.93/activity-submit/activity');
  </script>
</head>
<body>
<main>
  <span class="eyebrow"><span class="dot"></span>学生入口</span>
  <h1>正在进入课堂活动页</h1>
  <p>本页会自动跳转到服务器活动页面。若浏览器没有自动跳转，请点击下方按钮。</p>
  <div class="actions">
    <a href="http://159.75.213.93/activity-submit/activity">立即进入课堂活动</a>
    <a class="secondary" href="教师后台入口.html">教师入口</a>
    <a class="secondary" href="教师空白演示画布入口.html">教师空白画布</a>
  </div>
</main>
</body>
</html>
