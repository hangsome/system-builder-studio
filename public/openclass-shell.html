<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>公开课学生入口</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        background: #020617;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 18% 20%, rgba(14, 165, 233, 0.24), transparent 30%),
          radial-gradient(circle at 78% 16%, rgba(16, 185, 129, 0.18), transparent 28%),
          linear-gradient(135deg, #0f172a, #020617);
      }

      main {
        width: min(92vw, 760px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 32px;
        padding: 36px;
        background: rgba(255, 255, 255, 0.07);
        box-shadow: 0 30px 80px rgba(2, 6, 23, 0.36), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(16px);
      }

      .eyebrow {
        display: inline-flex;
        border: 1px solid rgba(125, 211, 252, 0.24);
        border-radius: 999px;
        padding: 8px 14px;
        color: #bae6fd;
        background: rgba(125, 211, 252, 0.1);
        font-size: 14px;
      }

      h1 {
        margin: 22px 0 12px;
        font-size: clamp(34px, 5vw, 58px);
        line-height: 1.04;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: #cbd5e1;
        line-height: 1.8;
        font-size: 17px;
      }

      .status {
        margin-top: 26px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 18px;
        background: rgba(15, 23, 42, 0.58);
        color: #e0f2fe;
      }

      a {
        display: inline-flex;
        margin-top: 22px;
        border-radius: 999px;
        padding: 12px 18px;
        background: #bae6fd;
        color: #0f172a;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">信息系统复习课</span>
      <h1>正在进入学生画布</h1>
      <p>系统会检查旧版本页面缓存，避免浏览器保留教师账号或旧资源导致 403。每次从公开课入口进入都会恢复干净的学生半成品画布。</p>
      <div class="status" id="status">正在准备，请稍候。</div>
      <a id="manual" href="/system-builder/openclass">如果没有自动跳转，点击这里进入</a>
    </main>

    <script>
      const target = `/system-builder/openclass?fresh=${Date.now()}`;
      const statusNode = document.getElementById('status');
      const manualNode = document.getElementById('manual');
      manualNode.setAttribute('href', target);

      async function clearOldClassroomState() {
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(
              registrations
                .filter((registration) => {
                  try {
                    return new URL(registration.scope).pathname.startsWith('/system-builder/');
                  } catch (error) {
                    return false;
                  }
                })
                .map((registration) => registration.unregister())
            );
          }

          if ('caches' in window) {
            const names = await caches.keys();
            await Promise.all(names.map((name) => caches.delete(name)));
          }
        } catch (error) {
          statusNode.textContent = '旧缓存清理未完全完成，将继续尝试进入课堂。';
        }
      }

      clearOldClassroomState().finally(() => {
        statusNode.textContent = '准备完成，正在跳转到公开课画布。';
        window.location.replace(target);
      });
    </script>
  </body>
</html>
